
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pandora V.3 | Academic Hub</title>


    <!-- PANDORA STYLES -->
    <link rel="stylesheet" href="./pandora-v3.css">

    <!-- TASK PLANNER STYLES -->
    <link rel="stylesheet" href="./pandora-tasks.css">

    <!-- QUIZ STUDIO STYLES -->
    <link rel="stylesheet" href="./pandora-quiz.css">

</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <span class="brand-icon">❀</span>
                <strong>PANDORA</strong>
                <small>Academic Hub</small>
            </div>

            <nav
                id="nav"
                aria-label="Main navigation">
            </nav>

            <div class="side-foot">
                ☕

                <small>
                    ctto ctta
                    <br>
                    Central Repo Hub Co.
                </small>
            </div>

        </aside>

        <!-- MAIN CONTENT -->
        <main>

            <header class="top">

                <button
                    id="mobileMenu"
                    class="mobile-menu"
                    aria-label="Toggle menu">
                    ☰
                </button>

                <label class="search">
                    ⌕

                    <input
                        id="search"
                        type="search"
                        placeholder="Search subjects, modules, reviewers, or practice links..."
                        autocomplete="off">
                </label>

            </header>

            <div
                id="content"
                class="content">
            </div>

        </main>

    </div>

    <!-- =====================================
         ORIGINAL SUBJECT FILES
         ===================================== -->

    <script src="./SUBJECTS/ged0083.js"></script>
    <script src="./SUBJECTS/ged0083L.js"></script>
    <script src="./SUBJECTS/it0015.js"></script>
    <script src="./SUBJECTS/it0035.js"></script>
    <script src="./SUBJECTS/it0035L.js"></script>
    <script src="./SUBJECTS/it0037.js"></script>
    <script src="./SUBJECTS/it0049.js"></script>
    <script src="./SUBJECTS/it0204.js"></script>

    <!-- =====================================
         PANDORA V.3 CORE
         ===================================== -->

    <script src="./pandora-data.js"></script>
    <script src="./pandora-icons.js"></script>
    <script src="./pandora-app.js"></script>

    <!-- =====================================
         PANDORA WIDGETS
         Load in dependency order
         ===================================== -->

    <script src="./pandora-tasks.js"></script>
    <script src="./pandora-tasks-ui.js"></script>
    <script src="./pandora-tasks-bridge.js"></script>
    <script src="./pandora-calendar.js"></script>
    <script src="./pandora-palette-editor.js"></script>

    <!-- =====================================
         PANDORA QUIZ STUDIO
         Step 1: Central Quiz Registry

         Future quiz modules will be connected
         here after their files are created.
         ===================================== -->

    <script src="./pandora-quiz-registry.js"></script>
    <script src="./pandora-quiz-manifest.js"></script>
    <script src="./pandora-quiz-sessions.js"></script>
    <script src="./pandora-quiz-ui.js"></script>
    <script src="./pandora-quiz-bridge.js"></script>
    <script>
    /* Pandora restore active page */
    (() => {
        const key = "pandora-v1.active-view";
        const nav = document.getElementById("nav");
        const content = document.getElementById("content");
        if (!nav || !content) return;
        const pageButtons = () => [...nav.querySelectorAll("[data-page]")];
        let saved;
        try { saved = JSON.parse(sessionStorage.getItem(key)); } catch {}
        if (saved?.page === "tasks") {
            window.PandoraTasksBridge?.openTasksPage();
        } else if (saved?.page === "quiz-studio") {
            window.PandoraQuizBridge?.openQuizStudio();
        } else if (saved?.page) {
            pageButtons().find(button => button.dataset.page === saved.page)?.click();
            if (saved.page === "subjects" && saved.subject) {
                [...content.querySelectorAll("[data-subject]")].find(button => button.dataset.subject === saved.subject)?.click();
            }
        }
        function rememberPage() {
            const active = pageButtons().find(button => button.classList.contains("active"));
            const page = content.querySelector("[data-pandora-tasks-page]") ? "tasks"
                : content.querySelector("[data-pandora-quiz-page]") ? "quiz-studio"
                : active?.dataset.page;
            if (!page) return;
            const subject = page === "subjects" && content.querySelector("[data-back]")
                ? content.querySelector(".hero h1")?.textContent.replace(/\s+\u2726\s*$/, "").trim()
                : null;
            try { sessionStorage.setItem(key, JSON.stringify({ page, subject })); } catch {}
        }
        new MutationObserver(rememberPage).observe(content, { childList: true });
        rememberPage();
    })();
    </script>

</body>

</html>
